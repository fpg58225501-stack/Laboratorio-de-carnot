<script>
const canvas = document.getElementById("grafico");
const ctx = canvas.getContext("2d");

const controle = document.getElementById("controle");

const pistao = document.getElementById("pistao");
const gas = document.getElementById("gas");

const fonte = document.getElementById("fonte");

const estado = document.getElementById("estado");
const volumeTexto = document.getElementById("volume");
const pressaoTexto = document.getElementById("pressao");
const temperaturaTexto = document.getElementById("temperatura");
const calorTexto = document.getElementById("calor");

const nomeEtapa = document.getElementById("nomeEtapa");
const descricaoEtapa = document.getElementById("descricaoEtapa");

const textoMovimento = document.getElementById("textoMovimento");
const setaMovimento = document.getElementById("setaMovimento");

/* =========================
   ESTADOS DO CICLO
========================= */

const A = {V:2.0, P:4.2};
const B = {V:4.3, P:2.25};
const C = {V:5.6, P:0.80};
const D = {V:2.85, P:1.70};

const gamma = 1.4;

/* =========================
   INTERPOLAÇÃO
========================= */

function lerp(a,b,t){
    return a+(b-a)*t;
}

/* =========================
   CICLO
========================= */

function pontoCiclo(progresso){

    let etapa = Math.floor(progresso/100);
    let t = (progresso % 100)/100;

    if(progresso >= 400){
        etapa = 3;
        t = 1;
    }

    /* A → B
       Expansão isotérmica */
    if(etapa === 0){

        let V = lerp(A.V,B.V,t);

        const k = A.P*A.V;

        return{
            V,
            P:k/V,
            T:500,
            etapa:0
        };
    }

    /* B → C
       Expansão adiabática */
    if(etapa === 1){

        let V = lerp(B.V,C.V,t);

        const k =
            B.P*Math.pow(B.V,gamma);

        let P =
            k/Math.pow(V,gamma);

        return{
            V,
            P,
            T:500-200*t,
            etapa:1
        };
    }

    /* C → D
       Compressão isotérmica */
    if(etapa === 2){

        let V = lerp(C.V,D.V,t);

        const k = C.P*C.V;

        return{
            V,
            P:k/V,
            T:300,
            etapa:2
        };
    }

    /* D → A
       Compressão adiabática */

    let V = lerp(D.V,A.V,t);

    const k =
        D.P*Math.pow(D.V,gamma);

    let P =
        k/Math.pow(V,gamma);

    return{
        V,
        P,
        T:300+200*t,
        etapa:3
    };
}

/* =========================
   CONVERSÃO P/V → TELA
========================= */

function coord(V,P){

    const largura =
        canvas.clientWidth;

    const altura =
        canvas.clientHeight;

    const left = 80;
    const right = 35;
    const top = 30;
    const bottom = 65;

    const Vmin = 1.5;
    const Vmax = 6.1;

    const Pmin = 0;
    const Pmax = 4.7;

    return{

        x:
        left+
        (V-Vmin)/(Vmax-Vmin)*
        (largura-left-right),

        y:
        altura-bottom-
        (P-Pmin)/(Pmax-Pmin)*
        (altura-top-bottom)

    };
}

/* =========================
   DESENHO
========================= */

function desenhar(){

    const largura =
        canvas.clientWidth;

    const altura =
        canvas.clientHeight;

    ctx.clearRect(
        0,
        0,
        largura,
        altura
    );

    /* EIXOS */

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(65,25);
    ctx.lineTo(65,altura-55);
    ctx.lineTo(largura-20,altura-55);

    ctx.stroke();

    /* SETA DO EIXO P */

    ctx.beginPath();

    ctx.moveTo(65,25);
    ctx.lineTo(59,38);

    ctx.moveTo(65,25);
    ctx.lineTo(71,38);

    ctx.stroke();

    /* SETA DO EIXO V */

    ctx.beginPath();

    ctx.moveTo(largura-20,altura-55);
    ctx.lineTo(largura-33,altura-61);

    ctx.moveTo(largura-20,altura-55);
    ctx.lineTo(largura-33,altura-49);

    ctx.stroke();

    ctx.fillStyle="#111";
    ctx.font="bold 17px Arial";

    ctx.fillText("P",38,32);
    ctx.fillText("V",largura-30,altura-27);

    /* ========================
       LINHAS PONTILHADAS
    ======================== */

    const pontos = {
        A:coord(A.V,A.P),
        B:coord(B.V,B.P),
        C:coord(C.V,C.P),
        D:coord(D.V,D.P)
    };

    ctx.setLineDash([3,4]);

    ctx.strokeStyle="#888";
    ctx.lineWidth=1;

    Object.values(pontos).forEach(p=>{

        ctx.beginPath();

        ctx.moveTo(65,p.y);
        ctx.lineTo(p.x,p.y);

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x,altura-55);

        ctx.stroke();

    });

    ctx.setLineDash([]);

    /* ========================
       CURVA A → B
       ISOTÉRMICA QUENTE
    ======================== */

    ctx.strokeStyle="#d33";
    ctx.lineWidth=3;

    ctx.beginPath();

    for(let i=0;i<=100;i++){

        const p=pontoCiclo(i);

        const c=coord(p.V,p.P);

        if(i===0)
            ctx.moveTo(c.x,c.y);
        else
            ctx.lineTo(c.x,c.y);
    }

    ctx.stroke();

    /* ========================
       B → C
       ADIABÁTICA
    ======================== */

    ctx.strokeStyle="#3557b7";
    ctx.lineWidth=3;

    ctx.beginPath();

    for(let i=100;i<=200;i++){

        const p=pontoCiclo(i);

        const c=coord(p.V,p.P);

        if(i===100)
            ctx.moveTo(c.x,c.y);
        else
            ctx.lineTo(c.x,c.y);
    }

    ctx.stroke();

    /* ========================
       C → D
       ISOTÉRMICA FRIA
    ======================== */

    ctx.strokeStyle="#d33";
    ctx.lineWidth=3;

    ctx.beginPath();

    for(let i=200;i<=300;i++){

        const p=pontoCiclo(i);

        const c=coord(p.V,p.P);

        if(i===200)
            ctx.moveTo(c.x,c.y);
        else
            ctx.lineTo(c.x,c.y);
    }

    ctx.stroke();

    /* ========================
       D → A
       ADIABÁTICA
    ======================== */

    ctx.strokeStyle="#3557b7";
    ctx.lineWidth=3;

    ctx.beginPath();

    for(let i=300;i<=400;i++){

        const p=pontoCiclo(i);

        const c=coord(p.V,p.P);

        if(i===300)
            ctx.moveTo(c.x,c.y);
        else
            ctx.lineTo(c.x,c.y);
    }

    ctx.stroke();

    /* ========================
       PONTOS
    ======================== */

    const lista = [
        ["A",A],
        ["B",B],
        ["C",C],
        ["D",D]
    ];

    lista.forEach(([nome,p])=>{

        const c=coord(p.V,p.P);

        ctx.beginPath();

        ctx.arc(
            c.x,
            c.y,
            5,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#111";
        ctx.fill();

        ctx.font="bold 15px Arial";

        ctx.fillText(
            nome,
            c.x-5,
            c.y-12
        );
    });

    /* ========================
       MARCAÇÕES DAS PRESSÕES
    ======================== */

    ctx.font="13px Arial";
    ctx.fillStyle="#333";

    ctx.fillText(
        "Pₐ",
        38,
        pontos.A.y+4
    );

    ctx.fillText(
        "Pᵦ",
        38,
        pontos.B.y+4
    );

    ctx.fillText(
        "Pᴅ",
        38,
        pontos.D.y+4
    );

    ctx.fillText(
        "Pᴄ",
        38,
        pontos.C.y+4
    );

    /* ========================
       MARCAÇÕES DOS VOLUMES
    ======================== */

    ctx.fillText(
        "Vₐ",
        pontos.A.x-10,
        altura-33
    );

    ctx.fillText(
        "Vᴅ",
        pontos.D.x-10,
        altura-33
    );

    ctx.fillText(
        "Vᵦ",
        pontos.B.x-10,
        altura-33
    );

    ctx.fillText(
        "Vᴄ",
        pontos.C.x-10,
        altura-33
    );

    /* ========================
       TQ / TF
    ======================== */

    ctx.fillStyle="#d33";
    ctx.font="italic bold 16px Arial";

    const tq=coord(3.2,3.15);

    ctx.fillText(
        "TQ",
        tq.x,
        tq.y
    );

    const tf=coord(3.8,1.15);

    ctx.fillText(
        "TF",
        tf.x,
        tf.y
    );

    /* ========================
       PONTO MÓVEL
    ======================== */

    const atual =
        pontoCiclo(
            Number(controle.value)
        );

    const cm =
        coord(
            atual.V,
            atual.P
        );

    ctx.beginPath();

    ctx.arc(
        cm.x,
        cm.y,
        8,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#ff9800";
    ctx.fill();

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;
    ctx.stroke();
}

/* =========================
   PISTÃO
========================= */

function atualizarPistao(p){

    const Vmin=2;
    const Vmax=5.6;

    let pos =
        90+
        (p.V-Vmin)/
        (Vmax-Vmin)*
        190;

    pistao.style.top=
        pos+"px";

    gas.style.height=
        pos+"px";
}

/* =========================
   TEXTO
========================= */

function atualizar(){

    const p =
        pontoCiclo(
            Number(controle.value)
        );

    atualizarPistao(p);

    volumeTexto.textContent =
        p.V.toFixed(2)+" L";

    pressaoTexto.textContent =
        p.P.toFixed(2)+" atm";

    temperaturaTexto.textContent =
        Math.round(p.T)+" K";

    if(p.etapa===0){

        estado.textContent="A → B";
        calorTexto.textContent="+Q₍Q₎";

        fonte.textContent=
            "🔥 Fonte quente";

        fonte.style.background=
            "#d9362b";

        textoMovimento.textContent=
            "EXPANSÃO";

        setaMovimento.textContent=
            "↓";

        nomeEtapa.textContent=
            "A → B — Expansão isotérmica";

        descricaoEtapa.innerHTML=
            "O gás recebe calor da fonte quente e se expande mantendo a temperatura constante.";
    }

    if(p.etapa===1){

        estado.textContent="B → C";
        calorTexto.textContent="Q = 0";

        fonte.textContent=
            "Sem troca de calor";

        fonte.style.background=
            "#555";

        textoMovimento.textContent=
            "EXPANSÃO";

        setaMovimento.textContent=
            "↓";

        nomeEtapa.textContent=
            "B → C — Expansão adiabática";

        descricaoEtapa.innerHTML=
            "O gás continua se expandindo sem trocar calor. Sua temperatura diminui.";
    }

    if(p.etapa===2){

        estado.textContent="C → D";
        calorTexto.textContent="−Q₍F₎";

        fonte.textContent=
            "❄ Fonte fria";

        fonte.style.background=
            "#2774ae";

        textoMovimento.textContent=
            "COMPRESSÃO";

        setaMovimento.textContent=
            "↑";

        nomeEtapa.textContent=
            "C → D — Compressão isotérmica";

        descricaoEtapa.innerHTML=
            "O gás é comprimido e libera calor para a fonte fria.";
    }

    if(p.etapa===3){

        estado.textContent="D → A";
        calorTexto.textContent="Q = 0";

        fonte.textContent=
            "Sem troca de calor";

        fonte.style.background=
            "#555";

        textoMovimento.textContent=
            "COMPRESSÃO";

        setaMovimento.textContent=
            "↑";

        nomeEtapa.textContent=
            "D → A — Compressão adiabática";

        descricaoEtapa.innerHTML=
            "O gás é comprimido sem trocar calor e sua temperatura aumenta.";
    }

    desenhar();
}

/* =========================
   CONTROLE
========================= */

controle.addEventListener(
    "input",
    atualizar
);

/* =========================
   ANIMAÇÃO
========================= */

let timer=null;

function iniciarAnimacao(){

    if(timer) return;

    timer=setInterval(()=>{

        let v=
            Number(controle.value);

        v++;

        if(v>400)
            v=0;

        controle.value=v;

        atualizar();

    },35);
}

function pausarAnimacao(){

    clearInterval(timer);

    timer=null;
}

function reiniciar(){

    pausarAnimacao();

    controle.value=0;

    atualizar();
}

/* =========================
   RESPONSIVIDADE
========================= */

function ajustarCanvas(){

    const rect=
        canvas.getBoundingClientRect();

    canvas.width=
        rect.width*
        devicePixelRatio;

    canvas.height=
        rect.height*
        devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    desenhar();
}

window.addEventListener(
    "resize",
    ajustarCanvas
);

ajustarCanvas();
atualizar();
</script>
